<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - LifeOS AI</title>

    <link rel="stylesheet" href="css/register.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            LifeOS <span>AI</span>
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="features.html">
                Features
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="profile.html">
                Profile
            </a>

        </nav>

    </header>



    <!-- ================= REGISTER SECTION ================= -->

    <main class="register-container">


        <section class="register-card">


            <!-- Heading -->

            <div class="register-heading">

                <p class="small-title">
                    LIFEOS AI
                </p>

                <h1>
                    Create Account
                </h1>

                <p>
                    Start managing your life smarter with AI.
                </p>

            </div>



            <!-- ================= REGISTER FORM ================= -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>



                <!-- CREATE ACCOUNT BUTTON -->

                <button
                    type="submit"
                    class="create-button"
                    id="createAccountButton">

                    Create Account

                </button>


                <!-- MESSAGE -->

                <p id="registerMessage"></p>


            </form>



            <!-- LOGIN LINK -->

            <div class="login-link">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>


        </section>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 LifeOS AI. All Rights Reserved.
        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/register.js"></script>


</body>

</html>
